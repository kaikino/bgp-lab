frr defaults traditional
hostname r1
log stdout
!
! a prefix for r1 to advertise once you get as far as parsing UPDATEs
ip route 10.2.0.0/24 blackhole
!
router bgp 65002
 bgp router-id 172.20.0.2
 ! RFC 8212: modern FRR refuses to exchange routes on an eBGP session with no
 ! policy configured. Fine to disable in a lab, never in production.
 no bgp ebgp-requires-policy
 !
 ! passive = FRR waits for us to connect, rather than both sides racing.
 ! Means our speaker never needs to bind port 179, so it never needs root.
 neighbor 172.20.0.3 remote-as 65001
 neighbor 172.20.0.3 passive
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
 exit-address-family
!
